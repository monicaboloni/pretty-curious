<style>

  .hero {

  .hero-tagline {

  .links {

    flex-direction: column;

    width: 100%;

  .link-pill {

    width: 100%;

    background: var(--pink-pill);

    font-family: 'Lora', serif;
    font-size: 1.05rem;
    border-radius: 999px;
    text-align: center;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 2px 0 rgba(122,42,32,0.08);
  }

  .link-pill:hover {
    background: var(--pink-pill-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(122,42,32,0.18);
  }

  .link-pill:active { transform: translateY(0); }

  /* ---------- UPLOAD SECTION ---------- */
  .uploads {
    background: var(--pink-bright);
    padding: 3.5rem 1.5rem 4.5rem;

  .video-frame {
    width: 100%;
    max-width: 900px;
    background: var(--pink-pale);
    border: 1px solid #c76e97;
    border-radius: 18px;
    padding: 0.9rem;
  }

  .video-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%; /* 16:9 */
    border-radius: 12px;
    overflow: hidden;
    background: #000;
  }

  .video-wrap iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.85rem;
    color: #a44a75;
    background: var(--pink-bright);
  }

  @media (max-width: 480px) {
    .hero { padding: 3.5rem 1.25rem 3rem; }
